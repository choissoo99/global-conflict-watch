name: Test GDELT Conflict Filter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gdelt:
    runs-on: ubuntu-latest
    steps:
      - name: Download, filter and deduplicate latest GDELT events
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --location --max-time 30 \
            --user-agent "GlobalConflictWatch/1.0" \
            "https://data.gdeltproject.org/gdeltv2/lastupdate.txt" \
            --output lastupdate.txt

          EVENT_URL="$(awk '/export\.CSV\.zip/ {print $3; exit}' lastupdate.txt)"
          test -n "$EVENT_URL"

          curl --fail --show-error --location --max-time 60 \
            --user-agent "GlobalConflictWatch/1.0" \
            "$EVENT_URL" \
            --output events.zip

          unzip -p events.zip > events.tsv
          echo "All GDELT rows: $(wc -l < events.tsv)"

          awk -F '\t' 'BEGIN {OFS="\t"} $29=="18" || $29=="19" || $29=="20" {print}' events.tsv > conflict.tsv
          echo "Conflict rows: $(wc -l < conflict.tsv)"

          # One news URL can generate multiple GDELT event rows.
          # For this first cleanup pass, keep only one row per SourceURL.
          awk -F '\t' '!seen[$61]++' conflict.tsv > dedup.tsv

          echo "Deduplicated rows: $(wc -l < dedup.tsv)"
          echo "Duplicates removed: $(( $(wc -l < conflict.tsv) - $(wc -l < dedup.tsv) ))"
          echo "Sample deduplicated conflict events:"
          awk -F '\t' 'BEGIN {OFS=" | "} NR<=10 {print "GlobalEventID="$1, "Date="$2, "EventCode="$27, "RootCode="$29, "QuadClass="$30, "Actor1="$7, "Actor2="$17, "Country="$52, "Lat="$57, "Lng="$58, "SourceURL="$61}' dedup.tsv

          test -s dedup.tsv
      - name: Upload GDELT events to Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Supabase connection ready"
          echo "Deduplicated events: $(wc -l < dedup.tsv)"
