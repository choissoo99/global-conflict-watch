name: Test GDELT Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gdelt:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GDELT lastupdate.txt
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing GDELT connection..."
          curl --fail --show-error --location --max-time 30 \
            --user-agent "GlobalConflictWatch/1.0" \
            "https://data.gdeltproject.org/gdeltv2/lastupdate.txt" \
            --output lastupdate.txt
          echo "GDELT response:"
          cat lastupdate.txt
          test -s lastupdate.txt
