name: Test GDELT Conflict Filter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gdelt:
    runs-on: ubuntu-latest
    steps:
      - name: Download and filter latest GDELT events
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --location --max-time 30 \
            --user-agent "GlobalConflictWatch/1.0" \
            "https://data.gdeltproject.org/gdeltv2/lastupdate.txt" \
            --output lastupdate.txt

          EVENT_URL="$(awk '/export\.CSV\.zip/ {print $3; exit}' lastupdate.txt)"
          test -n "$EVENT_URL"

          curl --fail --show-error --location --max-time 60 \
            --user-agent "GlobalConflictWatch/1.0" \
            "$EVENT_URL" \
            --output events.zip

          unzip -p events.zip > events.tsv
          echo "All GDELT rows: $(wc -l < events.tsv)"

          # GDELT EventRootCode 18=ASSAULT, 19=FIGHT, 20=USE UNCONVENTIONAL MASS VIOLENCE.
          # Start conservatively with these direct-violence families.
          awk -F '\t' 'BEGIN {OFS="\t"} $29=="18" || $29=="19" || $29=="20" {print}' events.tsv > conflict.tsv

          echo "Conflict rows: $(wc -l < conflict.tsv)"
          echo "Sample conflict events:"
          awk -F '\t' 'BEGIN {OFS=" | "} NR<=10 {print "GlobalEventID="$1, "Date="$2, "EventCode="$27, "RootCode="$29, "QuadClass="$30, "Actor1="$7, "Actor2="$17, "Country="$52, "Lat="$57, "Lng="$58, "SourceURL="$61}' conflict.tsv

          test -s conflict.tsv
