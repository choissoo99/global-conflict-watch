<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Conflict Watch</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css"></head>
<body><header><div><strong>GLOBAL CONFLICT WATCH</strong><span class="live">● LIVE</span></div><small>세계 분쟁·폭력 사건 모니터링</small></header>
<main><section id="map"><div class="map-legend"><b>LIVE MAP</b><span class="lg assault-dot">● 공격</span><span class="lg fight-dot">● 무력충돌</span><span class="lg mass-dot">● 대규모 폭력</span><span class="lg armed-dot">● 무장 사건</span><span>15분 자동 업데이트</span></div></section><aside><h2>최근 사건</h2><div class="filters"><select id="countryFilter"><option value="">전체 국가</option></select><select id="typeFilter"><option value="">전체 유형</option></select></div><div id="stats">불러오는 중...</div><div id="map-help">마커를 클릭하면 위치와 발생시간을 확인할 수 있습니다.</div><div id="detail"><b>사건 상세</b><p>지도 마커 또는 사건 목록을 선택하세요.</p></div><div id="feed"></div></aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script><script src="filters.js"></script></body></html>
