name: Test GDELT Conflict Filter

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  test-gdelt:
    runs-on: ubuntu-latest
    steps:
      - name: Download, filter and deduplicate latest GDELT events
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --location --max-time 30 \
            --user-agent "GlobalConflictWatch/1.0" \
            "https://data.gdeltproject.org/gdeltv2/lastupdate.txt" \
            --output lastupdate.txt

          EVENT_URL="$(awk '/export[.]CSV[.]zip/ {print $3; exit}' lastupdate.txt)"
          echo "Latest GDELT event file: $EVENT_URL"
          test -n "$EVENT_URL"

          curl --fail --show-error --location --max-time 60 \
            --user-agent "GlobalConflictWatch/1.0" \
            "$EVENT_URL" \
            --output events.zip

          unzip -p events.zip > events.tsv
          echo "All GDELT rows: $(wc -l < events.tsv)"

          awk -F '\t' 'BEGIN {OFS="\t"} $29=="18" || $29=="19" || $29=="20" {print}' events.tsv > conflict.tsv
          echo "Conflict rows: $(wc -l < conflict.tsv)"

          awk -F '\t' '!seen[$61]++' conflict.tsv > dedup.tsv
          echo "Deduplicated rows: $(wc -l < dedup.tsv)"
          test -s dedup.tsv

      - name: Upload GDELT events to Supabase
        shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          import csv
          import json
          import os
          import urllib.request

          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          rows = []

          with open("dedup.tsv", encoding="utf-8", errors="replace") as f:
              reader = csv.reader(f, delimiter="\t")
              for r in reader:
                  if len(r) < 61:
                      continue

                  global_event_id = r[0].strip()
                  event_date = r[1].strip()
                  event_code = r[26].strip()
                  source_url = r[60].strip()
                  root_code = r[28].strip()
                  event_type = {"18": "ASSAULT", "19": "FIGHT", "20": "MASS_VIOLENCE"}.get(root_code, "ARMED")
                  code = event_code
                  if code in {"180","181","182","1821","1822","183","1831","1832","1833","184"}:
                      event_type = "ARMED_ATTACK"
                  elif code in {"190","191","192","193","194","195","196"}:
                      event_type = "FIGHT"
                  elif code.startswith("20"):
                      event_type = "MASS_VIOLENCE"
                  country = r[53].strip() or None
                  city = r[52].strip() or None

                  try:
                      latitude = float(r[56]) if r[56].strip() else None
                      longitude = float(r[57]) if r[57].strip() else None
                  except ValueError:
                      latitude = None
                      longitude = None

                  if not global_event_id or not source_url:
                      continue

                  rows.append({
                      "source_id": f"gdelt:{global_event_id}",
                      "source_provider": "GDELT",
                      "external_id": global_event_id,
                      "event_type": event_type,
                      "title": f"GDELT conflict event {global_event_id}",
                      "summary": f"GDELT event code {event_code}",
                      "country": country,
                      "city": city,
                      "latitude": latitude,
                      "longitude": longitude,
                      "event_time": (
                          f"{event_date[:4]}-{event_date[4:6]}-{event_date[6:8]}T00:00:00Z"
                          if len(event_date) == 8 else None
                      ),
                      "fatalities": 0,
                      "injuries": 0,
                      "source_name": "GDELT",
                      "source_url": source_url,
                      "source_count": 1,
                      "confidence": 30,
                      "status": "unverified"
                  })

          if not rows:
              raise SystemExit("No GDELT rows to upload")

          data = json.dumps(rows).encode("utf-8")
          req = urllib.request.Request(
              supabase_url + "/rest/v1/events?on_conflict=source_id",
              data=data,
              method="POST",
              headers={
                  "apikey": service_key,
                  "Authorization": "Bearer " + service_key,
                  "Content-Type": "application/json",
                  "Prefer": "resolution=merge-duplicates,return=minimal"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              print("Supabase status:", response.status)

          print("GDELT rows submitted:", len(rows))
